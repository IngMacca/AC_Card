type: vertical-stack
cards:
  - type: custom:button-card
    entity: climate.sala_condizionatore
    name: sala
    icon: mdi:air-conditioner
    show_state: true
    tap_action:
      action: more-info
    styles:
      card:
        - background: linear-gradient(135deg,
        - border-radius: 22px
        - padding: 22px
        - border: 1px solid rgba(120,160,210,0.22)
        - box-shadow: 0 8px 28px rgba(0,0,0,0.35)
        - color: white
      grid:
        - grid-template-areas: '"i n power" "i s power"'
        - grid-template-columns: 60px 1fr 70px
        - grid-template-rows: min-content min-content
      icon:
        - color: '#42a5ff'
        - width: 42px
      name:
        - justify-self: start
        - font-size: 26px
        - font-weight: 700
      state:
        - justify-self: start
        - color: |
            [[[
              return entity?.state === 'off' ? '#8a94a6' : '#42a5ff';
            ]]]
        - font-size: 15px
    custom_fields:
      power:
        card:
          type: custom:button-card
          entity: climate.sala_condizionatore
          icon: mdi:power
          show_name: false
          tap_action:
            action: call-service
            service: climate.set_hvac_mode
            target:
              entity_id: climate.sala_condizionatore
            data:
              hvac_mode: 'off'
          styles:
            card:
              - width: 58px
              - height: 58px
              - border-radius: 50%
              - background: rgba(255,255,255,0.08)
              - border: 1px solid rgba(255,255,255,0.14)
              - box-shadow: none
            icon:
              - color: |
                  [[[
                    return entity?.state === 'off' ? '#8a94a6' : '#31a8ff';
                  ]]]
              - width: 32px
  - type: custom:button-card
    entity: climate.sala_condizionatore
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
        - background: linear-gradient(135deg,
        - border-radius: 20px
        - padding: 20px
        - border: 1px solid rgba(255,255,255,0.10)
        - color: white
        - box-shadow: none
      grid:
        - grid-template-areas: '"current minus target plus fan"'
        - grid-template-columns: 1.3fr 56px 1fr 56px
        - column-gap: 14px
        - align-items: center
    custom_fields:
      current: |
        [[[
          const current = entity?.attributes?.current_temperature ?? '--';
          return `
            <div>
              <div style="font-size:14px;color:#b7c1d3;margin-bottom:6px;">
                Temperatura attuale
              </div>
              <div style="font-size:38px;font-weight:700;">
                ${current} <span style="font-size:20px;color:#c8d0df;">°C</span>
              </div>
            </div>
          `;
        ]]]
      minus:
        card:
          type: custom:button-card
          entity: climate.sala_condizionatore
          icon: mdi:minus
          show_name: false
          tap_action:
            action: call-service
            service: climate.set_temperature
            target:
              entity_id: climate.sala_condizionatore
            data:
              temperature: |
                [[[
                  const raw = Number(entity?.attributes?.temperature);
                  const t = Number.isFinite(raw) ? raw : 24;
                  return Math.max(16, t - 0.5);
                ]]]
          styles:
            card:
              - width: 52px
              - height: 52px
              - border-radius: 50%
              - background: rgba(255,255,255,0.10)
              - box-shadow: none
            icon:
              - color: white
              - width: 28px
      target: |
        [[[
          const target = entity?.attributes?.temperature ?? '--';
          return `
            <div style="text-align:center;">
              <div style="font-size:14px;color:#b7c1d3;margin-bottom:6px;">
                Impostata
              </div>
              <div style="font-size:38px;font-weight:700;color:#39a7ff;">
                ${target} <span style="font-size:20px;">°C</span>
              </div>
            </div>
          `;
        ]]]
      plus:
        card:
          type: custom:button-card
          entity: climate.sala_condizionatore
          icon: mdi:plus
          show_name: false
          tap_action:
            action: call-service
            service: climate.set_temperature
            target:
              entity_id: climate.sala_condizionatore
            data:
              temperature: |
                [[[
                  const raw = Number(entity?.attributes?.temperature);
                  const t = Number.isFinite(raw) ? raw : 24;
                  return Math.min(30, t + 1);
                ]]]
          styles:
            card:
              - width: 52px
              - height: 52px
              - border-radius: 50%
              - background: rgba(255,255,255,0.10)
              - box-shadow: none
            icon:
              - color: white
              - width: 28px
